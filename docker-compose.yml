services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://rec:IntelliRecDB2026!@db:5432/recengine"
      SECRET_KEY: "IntelliRec_Final_Project_2026_SuperSecret_Key_ChangeMe"
      TOKEN_MINUTES: "120"
      CACHE_TTL: "60"
      N_TOPICS: "5"
      SEED_ON_START: "true"
      CORS_ORIGINS: "http://localhost:8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "recengine"
      POSTGRES_USER: "rec"
      POSTGRES_PASSWORD: "IntelliRecDB2026!"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rec -d recengine"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: